{% extends "main.html" %}
{% block tabs %}
<style>
    .md-main,
    .mdx-container {
        background-color: var(--ot-color-primary);
    }

    .mdx-hero__content {
        color: #fefefe;
        font-weight: 800;
        padding: 50px 16px 16px;
    }

    .md-button {
        color: #fefefe !important;
        margin: 8px 4px;
    }
    .md-flex {
        justify-content: center;
    }

    .md-typeset .md-button:focus, .md-typeset .md-button:hover {
        background-color: #fefefe;
        border-color: var(--ot-color-primary);
        color: var(--ot-color-primary) !important;
    }

    @media (max-width: 720px) {
        .mdx-hero__content {
            padding: 16px;
        }
    }
    .mdx-container {
        min-height: calc(100vh - 180px);
    }

    .mdx-container ul > li {
        font-weight: normal;
    }
</style>
<section class="mdx-container">
    <div class="md-flex md-typeset">
        {% if page.meta and page.meta.hero_image %}
        <div class="mdx-hero">
            <img src="{{page.meta.hero_image}}" alt="{{ config.site_name }} logo" class="mdx-hero__logo">
        </div>
        {% endif %}
        <div class="mdx-hero__content">
            {{ page.content }}
        </div>
    </div>
    <div class="md-flex md-typeset md-buttons">
        {% for button in config.extra.home_buttons %}
        <a href="{{ button.link }}" class="md-button">{{ button.title }}</a>
        {% endfor %}
    </div>
</section>
{% endblock %}
{% block content %}{% endblock %}
{% block footer %}{% endblock %}
